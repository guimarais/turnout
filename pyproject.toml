[project]
name = "turnout"
version = "0.1.0"
description = "Local MCP tools for generating Märklin C-track layouts in XTrackCAD"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["mcp>=1.26,<3"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
